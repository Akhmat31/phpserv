services:
  ci-test:
    container_name: ci-test
    build:
      context: .
      dockerfile: Dockerfile
    image: ci-test
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "composer install && cd plugins && composer dump-autoload && cd .. && composer dump-autoload"
  ci-dev:
    container_name: ci-dev
    build:
      context: .
      dockerfile: Dockerfile
    image: ci-dev
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t public/